name: Merge tools to puzzles

on:
  schedule:
    # Run once a week on Monday at 00:00 UTC (night from Sunday to Monday)
    - cron: '0 0 * * 1'

  workflow_dispatch:
    # Allow manual trigger

jobs:
  merge_branches:
    runs-on: ubuntu-latest
    name: Merge tools branch into puzzles
    permissions:
      contents: write

    steps:
      # Step 1: Checkout puzzles branch
      - name: Checkout puzzles branch
        uses: actions/checkout@v5
        with:
          ref: puzzles
          fetch-depth: 0
          # Required for pushing changes
          persist-credentials: true

      # Step 2: Configure git
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Step 3: Fetch tools branch
      - name: Fetch tools branch
        run: git fetch origin tools:tools

      # Step 4: Merge tools into puzzles
      - name: Merge tools into puzzles
        id: merge
        run: |
          echo "Attempting to merge tools into puzzles..."
          if git merge tools --no-edit -m "Merge tools into puzzles (automated weekly merge)"; then
            echo "merge_status=success" >> $GITHUB_OUTPUT
            echo "Merge completed successfully"
          else
            echo "merge_status=conflict" >> $GITHUB_OUTPUT
            echo "Merge conflict detected"
            exit 1
          fi

      # Step 5: Push changes to puzzles
      - name: Push changes to puzzles
        if: steps.merge.outputs.merge_status == 'success'
        run: |
          echo "Pushing merged changes to puzzles..."
          git push origin puzzles

      # Step 6: Report status
      - name: Merge successful
        if: steps.merge.outputs.merge_status == 'success'
        run: echo "Successfully merged tools into puzzles and pushed changes."

      - name: Merge conflict
        if: steps.merge.outputs.merge_status == 'conflict'
        run: |
          echo "::error::Merge conflict occurred. Manual intervention required."
          exit 1
